<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text-to-SVG Diagrams for Excel</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="taskpane.css" />
  </head>
  <body>
    <h1>Text-to-SVG Diagrams for Excel</h1>

    <label class="field-label" for="sheet-diagram-select">Sheet diagram</label>
    <select id="sheet-diagram-select" aria-label="Select Mermaid diagram in active sheet">
      <option value="">(No diagram selected)</option>
    </select>

    <textarea
      id="mermaid-input"
      aria-label="Mermaid code"
      spellcheck="false"
      placeholder="graph TD&#10;A-->B"
    >
graph LR
    A[Start] --> B{Condition}
    B -->|Yes| C[Process A]
    B -->|No| D[Process B]
    C --> E[End]
    D --> E</textarea
    >
    <div
      id="splitter"
      role="separator"
      aria-orientation="horizontal"
      aria-label="Resize editor"
      tabindex="0"
    ></div>

    <div class="buttons">
      <div class="insert-group">
        <select id="format-select" aria-label="Output format">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
          <option value="svg">SVG</option>
          <option value="svg-office">SVG (for shape conversion)</option>
          <option value="shapes">Shapes (editable)</option>
        </select>
        <button id="insert-btn" class="action-btn" disabled>Insert to Excel</button>
      </div>
      <button id="download-btn" class="action-btn" disabled>Download</button>
    </div>

    <div id="error"></div>

    <div id="preview"></div>

    <script src="taskpane.js"></script>
  </body>
</html>
